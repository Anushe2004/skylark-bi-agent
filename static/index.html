<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Skylark Drones — BI Agent</title>
<style>
  body { font-family: -apple-system, Segoe UI, sans-serif; max-width: 720px; margin: 40px auto; background:#0f1115; color:#e6e6e6; }
  h1 { font-size: 1.3rem; }
  #log { border: 1px solid #2a2d33; border-radius: 8px; height: 480px; overflow-y: auto; padding: 16px; background:#171922; }
  .msg { margin-bottom: 14px; line-height: 1.4; white-space: pre-wrap; }
  .user { color: #8ab4f8; }
  .bot { color: #e6e6e6; }
  form { display: flex; gap: 8px; margin-top: 12px; }
  input { flex: 1; padding: 10px; border-radius: 6px; border: 1px solid #2a2d33; background:#171922; color:#e6e6e6; }
  button { padding: 10px 16px; border-radius: 6px; border: none; background: #4c7cf0; color: white; cursor: pointer; }
  button:disabled { opacity: 0.5; cursor: default; }
</style>
</head>
<body>
  <h1>Skylark Drones — Business Intelligence Agent</h1>
  <p>Ask about pipeline, sectors, deal stages, work orders, or billing status.</p>
  <div id="log"></div>
  <form id="form">
    <input id="input" placeholder="e.g. How's our pipeline looking for the energy sector?" autocomplete="off" />
    <button type="submit">Send</button>
  </form>

<script>
let sessionId = null;
const log = document.getElementById("log");
const form = document.getElementById("form");
const input = document.getElementById("input");

function addMsg(text, cls) {
  const div = document.createElement("div");
  div.className = "msg " + cls;
  div.textContent = (cls === "user" ? "You: " : "Agent: ") + text;
  log.appendChild(div);
  log.scrollTop = log.scrollHeight;
}

form.addEventListener("submit", async (e) => {
  e.preventDefault();
  const message = input.value.trim();
  if (!message) return;
  addMsg(message, "user");
  input.value = "";
  input.disabled = true;

  try {
    const res = await fetch("/api/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ message, session_id: sessionId }),
    });
    const data = await res.json();
    sessionId = data.session_id || sessionId;
    addMsg(data.reply || data.error || "No response.", "bot");
  } catch (err) {
    addMsg("Network error: " + err.message, "bot");
  } finally {
    input.disabled = false;
    input.focus();
  }
});
</script>
</body>
</html>
